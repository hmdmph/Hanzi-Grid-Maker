name: Biweekly Dependency Update

on:
  schedule:
    # Runs daily; the gate step below turns this into a true 14-day
    # cadence anchored to 2026-10-02 (cron alone can't express "every
    # 14 days from a start date" across month boundaries).
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether today is a scheduled update day
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch — running regardless of cadence."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          start_date="2026-10-02"
          days=$(( ( $(date -u +%s) - $(date -u -d "$start_date" +%s) ) / 86400 ))
          rem=$(( days % 14 ))
          echo "Day $days since $start_date (day % 14 = $rem)"
          if [ "$rem" -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        if: steps.gate.outputs.run == 'true'
        with:
          go-version: "1.26"

      - name: Update Go dependencies
        if: steps.gate.outputs.run == 'true'
        id: deps
        run: |
          go get -u ./...
          go mod tidy
          if git diff --quiet -- go.mod go.sum; then
            echo "No dependency changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit, bump version tag, and push
        if: steps.gate.outputs.run == 'true' && steps.deps.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          git commit -m "chore: biweekly dependency update"
          git push origin HEAD:main

          latest_tag=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
          if [ -z "$latest_tag" ]; then
            latest_tag="0.0.0"
          fi
          IFS='.' read -r major minor patch <<< "$latest_tag"
          new_tag="${major}.${minor}.$((patch + 1))"

          git tag "$new_tag"
          git push origin "$new_tag"
          echo "Pushed tag $new_tag — release.yml will build and publish it."
