name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install Fyne/X11 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libxkbcommon-dev libxrandr-dev \
            libxcursor-dev libxinerama-dev libxi-dev xorg-dev

      - name: go vet
        run: go vet ./...

      - name: Build CLI (no CGO)
        run: CGO_ENABLED=0 go build -o /dev/null .

      - name: Build GUI (CGO, gui tag)
        run: CGO_ENABLED=1 go build -tags gui -o /dev/null .
