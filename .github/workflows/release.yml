name: Release

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (for manual dry runs)"
        required: true

permissions:
  contents: write

jobs:
  build-cli-and-linux-gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install Fyne/X11 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libxkbcommon-dev libxrandr-dev \
            libxcursor-dev libxinerama-dev libxi-dev xorg-dev

      - name: Build CLI binaries for all platforms
        run: make build-all

      - name: Build Linux native GUI binary
        run: make build-gui

      - uses: actions/upload-artifact@v4
        with:
          name: cli-and-linux-gui
          path: build/hanze-grid-maker-*
          if-no-files-found: error

  build-macos-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build macOS .app bundle
        run: make package-macos

      - name: Zip the .app bundle
        run: cd build && zip -r Hanzi-grid-maker.app.zip Hanzi-grid-maker.app

      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: build/Hanzi-grid-maker.app.zip
          if-no-files-found: error

  publish-release:
    needs: [build-cli-and-linux-gui, build-macos-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          gh release create "$tag" release-assets/* \
            --title "$tag" \
            --generate-notes
